<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>FormCheck — Overhead Press</title>
<link rel="stylesheet" href="shared/style.css" />
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>
<div id="notice">
  <p>Camera access is needed to analyse your press. Allow access and tap retry.</p>
  <button id="retry" type="button">Retry</button>
</div>

<script src="shared/pose.js"></script>
<script>
/*
 * Overhead press: torso lean, bar path, lockout. Side-on view.
 */
(function () {
  "use strict";

  var FC = window.FormCheck;
  var LM = FC.LM;

  /* thresholds carried over from the tuned reference build */
  var TORSO_BAD_LIMIT_DEG = 15;   // live highlight threshold
  var TORSO_SCORE1_DEG = 25;      // lean beyond this scores 1
  var TORSO_SCORE2_DEG = 15;      // lean beyond this scores 2
  /* bar path is judged as deviation from the straight line joining the rack
     position to the overhead peak, not as raw horizontal travel: moving the bar
     back over the head during a press is correct form, not drift. */
  /* Natural presses move around the face and camera jitter exaggerates the arc.
     Keep a wide good band and reserve penalties for unmistakable curvature. */
  var BARPATH_SCORE1_NORM = 0.45; // severe curve: nearly half a torso length
  var BARPATH_SCORE2_NORM = 0.28; // clearly excessive curve
  /* lockout is elbow extension at the peak, plus wrist height over the shoulder */
  var LOCKOUT_ELBOW_GOOD_DEG = 155;
  var LOCKOUT_ELBOW_PARTIAL_DEG = 135;
  var LOCKOUT_HEIGHT_GOOD = 0.45;   // wrist above shoulder, in torso lengths
  var LOCKOUT_HEIGHT_PARTIAL = 0.30;
  var START_MOVE_FRAC = 0.05;     // wrist rise above rack that starts a rep
  var RETURN_MARGIN_FRAC = 0.08;  // wrist back down at the rack
  var REP_MIN_TRAVEL_FRAC = 0.20; // required vertical travel
  var REP_TIMEOUT_MS = 6000;      // abandon a stuck rep attempt

  var pickSide = FC.createSideTracker(
    [LM.LEFT_SHOULDER, LM.LEFT_HIP, LM.LEFT_WRIST, LM.LEFT_ELBOW],
    [LM.RIGHT_SHOULDER, LM.RIGHT_HIP, LM.RIGHT_WRIST, LM.RIGHT_ELBOW]
  );

  /* max horizontal distance of the recorded wrist path from the straight line
     between its first and last point, normalised by torso length */
  function pathDeviation(points, torsoLen) {
    if (!points || points.length < 3 || torsoLen < 1) return 0;
    var a = points[0], b = points[points.length - 1];
    var dy = b.y - a.y;
    if (Math.abs(dy) < 1) return 0;
    var worst = 0;
    for (var i = 1; i < points.length - 1; i++) {
      var p = points[i];
      var expectedX = a.x + ((p.y - a.y) / dy) * (b.x - a.x);
      var d = Math.abs(p.x - expectedX);
      if (d > worst) worst = d;
    }
    return worst / torsoLen;
  }

  var repState = "idle";
  var repData = null;
  var repCount = 0;
  var lastRepScores = null;

  var torsoScore = 3, barPathScore = 3, lockoutScore = 3;
  var flaggedIndices = [];

  function completeRep(rd) {
    var t = rd.maxTorsoAngle > TORSO_SCORE1_DEG ? 1 : (rd.maxTorsoAngle > TORSO_SCORE2_DEG ? 2 : 3);
    var peakTorsoLen = rd.peakTorsoLen || rd.torsoLenRef;
    var dev = pathDeviation(rd.path, peakTorsoLen);
    var b = dev > BARPATH_SCORE1_NORM ? 1 : (dev > BARPATH_SCORE2_NORM ? 2 : 3);

    var elbow = rd.peakElbowAngle;
    var height = rd.peakHeightNorm;
    var l;
    if (elbow === null) {
      /* elbow not visible: fall back to height alone rather than punishing */
      l = height >= LOCKOUT_HEIGHT_GOOD ? 3 : (height >= LOCKOUT_HEIGHT_PARTIAL ? 2 : 1);
    } else if (elbow >= LOCKOUT_ELBOW_GOOD_DEG && height >= LOCKOUT_HEIGHT_GOOD) {
      l = 3;
    } else if (elbow >= LOCKOUT_ELBOW_PARTIAL_DEG && height >= LOCKOUT_HEIGHT_PARTIAL) {
      l = 2;
    } else {
      l = 1;
    }

    var average = (t + b + l) / 3;

    torsoScore = t;
    barPathScore = b;
    lockoutScore = l;
    repCount += 1;
    lastRepScores = {
      torso: t,
      barPath: b,
      lockout: l,
      average: Math.round(average * 100) / 100,
      verdict: FC.verdictFromAverage(average)
    };
  }

  function onFrame(landmarks, frame) {
    var side = repState === "pressing" && repData ? repData.side : pickSide(landmarks).side;
    var left = side === "left";
    var idx = {
      shoulder: left ? LM.LEFT_SHOULDER : LM.RIGHT_SHOULDER,
      hip: left ? LM.LEFT_HIP : LM.RIGHT_HIP,
      wrist: left ? LM.LEFT_WRIST : LM.RIGHT_WRIST,
      elbow: left ? LM.LEFT_ELBOW : LM.RIGHT_ELBOW
    };

    var shoulderLm = landmarks[idx.shoulder];
    var hipLm = landmarks[idx.hip];
    var wristLm = landmarks[idx.wrist];
    var elbowLm = landmarks[idx.elbow];
    flaggedIndices = [];

    var visOk = shoulderLm && hipLm && wristLm &&
      (shoulderLm.visibility || 0) >= FC.VIS_THRESHOLD &&
      (hipLm.visibility || 0) >= FC.VIS_THRESHOLD &&
      (wristLm.visibility || 0) >= FC.VIS_THRESHOLD;

    var elbowOk = elbowLm && (elbowLm.visibility || 0) >= FC.VIS_THRESHOLD;

    if (!visOk) {
      if (repState === "pressing" && repData && frame.now - repData.startTime > REP_TIMEOUT_MS) {
        repState = "idle";
        repData = null;
      }
      return;
    }

    var shoulderX = shoulderLm.x * frame.width, shoulderY = shoulderLm.y * frame.height;
    var hipX = hipLm.x * frame.width, hipY = hipLm.y * frame.height;
    var wristX = wristLm.x * frame.width, wristY = wristLm.y * frame.height;

    var torsoLen = Math.hypot(shoulderX - hipX, shoulderY - hipY);
    if (torsoLen < 1) return;

    var angleDeg = Math.abs((Math.atan2(shoulderX - hipX, hipY - shoulderY) * 180) / Math.PI);
    var liveTorsoBad = angleDeg > TORSO_BAD_LIMIT_DEG;
    var liveBarPathBad = false;
    var liveLockoutBad = false;

    var diffNorm = (shoulderY - wristY) / torsoLen; // positive = wrist above shoulder

    if (repState === "idle") {
      if (diffNorm > START_MOVE_FRAC) {
        repState = "pressing";
        repData = {
          side: side,
          startTime: frame.now,
          startWristX: wristX,
          startShoulderY: shoulderY,
          facingSign: wristX - shoulderX >= 0 ? 1 : -1,
          maxTorsoAngle: angleDeg,
          peaked: false,
          minWristY: wristY,
          peakShoulderX: shoulderX,
          peakWristX: wristX,
          peakTorsoLen: torsoLen,
          peakElbowAngle: null,
          peakHeightNorm: diffNorm,
          path: [{ x: wristX, y: wristY }],
          torsoLenRef: torsoLen
        };
      }
    } else if (repState === "pressing") {
      if (frame.now - repData.startTime > REP_TIMEOUT_MS) {
        repState = "idle";
        repData = null;
      } else {
        repData.maxTorsoAngle = Math.max(repData.maxTorsoAngle, angleDeg);

        var last = repData.path[repData.path.length - 1];
        if (Math.abs(wristY - last.y) > 2 || Math.abs(wristX - last.x) > 2) {
          repData.path.push({ x: wristX, y: wristY });
          if (repData.path.length > 240) repData.path.shift();
        }
        /* Live highlighting is reserved for severe drift; ordinary forward/back
           movement around the face should not look like an active fault. */
        liveBarPathBad = pathDeviation(repData.path, torsoLen) > BARPATH_SCORE1_NORM;

        if (wristY < repData.minWristY) {
          repData.minWristY = wristY;
          repData.peakShoulderX = shoulderX;
          repData.peakWristX = wristX;
          repData.peakTorsoLen = torsoLen;
          repData.peakHeightNorm = diffNorm;
          repData.peakElbowAngle = elbowOk
            ? FC.angleBetween(
                { x: elbowLm.x * frame.width, y: elbowLm.y * frame.height },
                { x: shoulderX, y: shoulderY },
                { x: wristX, y: wristY }
              )
            : null;
        }

        /* only warn about lockout once the bar is genuinely near the top */
        liveLockoutBad =
          diffNorm > LOCKOUT_HEIGHT_PARTIAL &&
          repData.peakElbowAngle !== null &&
          repData.peakElbowAngle < LOCKOUT_ELBOW_GOOD_DEG;

        if (diffNorm > RETURN_MARGIN_FRAC * 1.5) repData.peaked = true;

        if (repData.peaked && diffNorm < RETURN_MARGIN_FRAC) {
          var travelNorm = (repData.startShoulderY - repData.minWristY) / torsoLen;
          if (travelNorm >= REP_MIN_TRAVEL_FRAC) completeRep(repData);
          repState = "idle";
          repData = null;
        }
      }
    }

    var flags = [];
    if (liveTorsoBad) flags.push(idx.shoulder, idx.hip);
    if (liveBarPathBad || liveLockoutBad) flags.push(idx.wrist, idx.shoulder);
    flaggedIndices = flags;
  }

  function statusFor(score, badLabel) {
    return score >= 3 ? "good" : badLabel;
  }

  function payload() {
    return {
      exercise: "overhead",
      repCount: repCount,
      torsoScore: torsoScore,
      barPathScore: barPathScore,
      lockoutScore: lockoutScore,
      torsoStatus: statusFor(torsoScore, "torso"),
      barPathStatus: statusFor(barPathScore, "barpath"),
      lockoutStatus: statusFor(lockoutScore, "lockout"),
      latestCue: "",
      lastRepScores: lastRepScores,
      phase: repState
    };
  }

  FC.start({
    onFrame: onFrame,
    payload: payload,
    flagged: function () { return flaggedIndices; }
  });
})();
</script>
</body>
</html>
